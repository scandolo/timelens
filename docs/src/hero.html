<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#fafafa;--fg:#17181a;--muted:#5f636a;--card:#fff;--border:#e6e7e9;--chip:#eef0f2}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f11;--fg:#ecedef;--muted:#9a9fa7;--card:#16181b;--border:#26292d;--chip:#1f2226}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
.wrap{width:1280px;height:640px;padding:64px 72px;display:grid;grid-template-columns:minmax(0,1fr) 540px;gap:48px;align-items:center;overflow:hidden}
.logo{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:650;letter-spacing:-.02em}
.logo img{width:52px;height:52px}
h1{font-size:52px;line-height:1.05;letter-spacing:-.035em;margin:28px 0 18px;font-weight:700}
h1 span{color:var(--muted);font-weight:500}
p{font-size:21px;line-height:1.45;color:var(--muted);margin:0 0 30px;max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.shot{border-radius:18px;overflow:hidden;border:1px solid var(--border);box-shadow:0 30px 80px rgba(0,0,0,.18);transform:rotate(-1.2deg) translateY(10px)}
.shot img{display:block;width:100%}
</style></head><body><div class="wrap">
<div>
  <div class="logo"><img src="../../assets/icon.svg">timelens</div>
  <h1>Six hours in Claude.<br><span>Doing what?</span></h1>
  <p>timelens checks your screen once a minute and files it under categories you choose. Every evening you get the day back, minute by minute.</p>
  <div class="chips"><span class="chip">Runs in the background</span><span class="chip">~$0.02 a day</span><span class="chip">Keeps no screenshots</span><span class="chip">One Python file</span></div>
</div>
<div class="shot"><img id="s"></div>
</div><script>s.src=matchMedia('(prefers-color-scheme: dark)').matches?'../images/day-dark.png':'../images/day-light.png'</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Set up timelens</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#fafafa;--fg:#17181a;--muted:#6b6f76;--card:#fff;--border:#e3e5e8;--track:#eef0f2;--field:#f4f5f7;--accent:#3b6fe0;--accent-soft:#e8eefc;--good:#1f9d62;--bad:#d4443f;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f11;--fg:#ecedef;--muted:#8d929a;--card:#16181b;--border:#2a2d31;--track:#23262a;--field:#1d2024;--accent-soft:#1c2740;--good:#3fc485;--bad:#f06a63;--warn:#e0a020}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px}.wrap.wide{max-width:1080px}
header{display:flex;align-items:center;gap:12px;margin-bottom:32px}header img{width:36px;height:36px}header b{font-size:19px;letter-spacing:-.01em}
.steps{display:flex;gap:6px;margin-left:auto}.steps i{width:24px;height:4px;border-radius:2px;background:var(--track)}.steps i.on{background:var(--accent)}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}p.lead{color:var(--muted);margin:0 0 24px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tile{width:36px;height:36px;border-radius:9px;background:var(--track);display:grid;place-items:center;flex:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px}
.opt{display:flex;gap:14px;align-items:center;cursor:pointer;padding:12px 16px;margin-bottom:8px;transition:border-color .15s}
.opt:hover{border-color:var(--muted)}.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.opt.on .tile{background:var(--accent);color:#fff}
.opt b{font-weight:600}.opt .aud{color:var(--muted);font-size:14px;margin-left:8px}
.catlist{padding:0;overflow:hidden}
.cat{display:grid;grid-template-columns:36px minmax(0,1fr) auto 20px;gap:14px;align-items:start;padding:16px 18px}
.cat+.cat{border-top:1px solid var(--border)}
.ghost{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:7px;width:100%;resize:none;overflow:hidden;display:block;padding:2px 8px;margin-left:-8px}
.ghost:hover{background:var(--field)}.ghost:focus{background:var(--field);border-color:var(--accent);outline:none}
.ghost.title{font-weight:600;font-size:15px}.ghost.desc{color:var(--muted);font-size:14px;line-height:1.45;margin-top:2px}
.ghost.ex{font-size:13px;margin-top:6px;color:var(--fg)}.ghost::placeholder{color:var(--muted);opacity:.7}
.addex{display:block;margin:8px 0 0 auto;border:0;background:none;padding:0;font-size:12.5px;color:var(--muted);cursor:pointer}.addex:hover{color:var(--accent)}
.kw{text-align:right}
.cat .tile{margin-top:2px}.cat .x{margin-top:4px}
.pills{display:inline-flex;background:var(--track);border-radius:8px;padding:2px;gap:2px}
.pills button{border:0;background:none;padding:4px 9px;border-radius:6px;font-size:12.5px;color:var(--muted)}
.pills button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.pills button.on.focus{background:var(--accent);color:#fff}.pills button.on.distraction{background:var(--bad);color:#fff}
.cost{font-size:12px;font-weight:600;color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);border-radius:999px;padding:2px 9px;margin-left:auto;white-space:nowrap}
.catchall{font-size:12.5px;color:var(--muted);padding-top:4px}
input,textarea{font:inherit;color:inherit;background:var(--field);border:1px solid var(--border);border-radius:10px;padding:9px 12px;width:100%}
textarea{resize:vertical}input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:flex;align-items:center;gap:8px;font-weight:600;margin:22px 0 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:10px;padding:9px 16px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}button:disabled{opacity:.45;cursor:default}
button.x{padding:6px 0;border:0;background:none;color:var(--muted);font-size:18px;line-height:1}button.x:hover{color:var(--bad)}
button.q{width:24px;height:24px;padding:0;border-radius:50%;font-size:13px;font-weight:700;color:var(--muted);display:grid;place-items:center}
button.add{display:flex;gap:8px;align-items:center;margin-top:4px}
.nav{display:flex;justify-content:space-between;margin-top:32px}
.hint{font-size:13px;color:var(--muted)}.ok{color:var(--good)}.err{color:var(--bad)}.warn{color:var(--warn)}
.tabs{display:inline-flex;background:var(--track);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.tabs button{border:0;background:none;display:flex;gap:8px;align-items:center;color:var(--muted);border-radius:9px;padding:8px 14px}
.tabs button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.prompt{display:flex;gap:10px;align-items:center;background:var(--track);border-radius:10px;padding:12px 14px;font:14px ui-monospace,monospace;margin:10px 0}
.prompt span{flex:1;word-break:break-word}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;animation:p 1.4s infinite}@keyframes p{50%{opacity:.25}}
.banner{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:14px}
.proj{display:grid;grid-template-columns:24px 220px 1fr;gap:10px;align-items:center;padding:6px 0}.proj+.proj{border-top:1px solid var(--border)}
code{font:13px ui-monospace,monospace;background:var(--track);padding:2px 6px;border-radius:5px;word-break:break-all}
.proj code{background:none;padding:0}
.toggle{display:flex;gap:12px;align-items:flex-start;cursor:pointer}.toggle input{width:auto;margin-top:4px}
.live td{padding:6px 10px 6px 0;font-size:14px;border-top:1px solid var(--border)}.live{width:100%;border-collapse:collapse}
ol.todo{padding-left:0;list-style:none;counter-reset:s;margin:0}ol.todo li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:10px 0}
ol.todo li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-size:13px;font-weight:600}
.frame{width:100%;height:760px;border:1px solid var(--border);border-radius:14px;background:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px;z-index:9}
.modal .card{max-width:520px;width:100%;padding:24px;margin:0}.modal ol{padding-left:20px;margin:12px 0}.modal li{margin:8px 0}
@media (max-width:700px){.cat{grid-template-columns:36px 1fr 20px}.cat>.kw{grid-column:2;grid-row:2}.proj{grid-template-columns:24px 1fr}.proj input{grid-column:2}.opt .aud{display:block;margin:0}}
</style></head><body><div class="wrap">
<header><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314161a'/%3E%3Cg transform='translate(9 28)'%3E%3Crect width='10' height='8' rx='2' fill='%233b6fe0'/%3E%3Crect x='12' width='6' height='8' rx='2' fill='%232fa58a'/%3E%3Crect x='20' width='4' height='8' rx='2' fill='%23e0566b'/%3E%3Crect x='26' width='9' height='8' rx='2' fill='%236c8ff0'/%3E%3Crect x='37' width='9' height='8' rx='2' fill='%23e0a020'/%3E%3C/g%3E%3Ccircle cx='35' cy='32' r='13' fill='none' stroke='white' stroke-width='3.5'/%3E%3Cline x1='44.5' y1='41.5' x2='53' y2='50' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" alt=""><b>timelens</b><div class="steps" id="dots"></div></header>
<main id="view"></main><div id="modal"></div>
</div><script>
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = (path, body) => fetch(path, body ? {method: 'POST', body: JSON.stringify(body)} : {}).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j });

const ICONS = {  // line icons, 24x24, drawn with currentColor
  compass: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/>',
  briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 13h18"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  zap: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  cap: '<path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5M22 9v6"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  chat: '<path d="M21 11.5a8.4 8.4 0 0 1-12.2 7.5L3 21l1.9-5.7A8.4 8.4 0 1 1 21 11.5z"/>',
  video: '<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10.5 6-3.5v10l-6-3.5"/>',
  book: '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  coffee: '<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/>',
  sprout: '<path d="M12 21v-8"/><path d="M12 13C12 8.5 8.5 5 4 5c0 4.5 3.5 8 8 8zM12 11c0-4 3-7 8-7 0 4-3 7-8 7z"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  phone: '<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="m10 8.5 5.5 3.5-5.5 3.5z"/>',
  news: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/>',
  bag: '<path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  receipt: '<path d="M5 3h14v18l-2.5-1.5L14 21l-2-1.5L10 21l-2.5-1.5L5 21z"/><path d="M9 8h6M9 12h6"/>',
  dots: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  tag: '<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.2"/>',
  bot: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 14h.01M15 14h.01"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  folder: '<path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
  cloud: '<path d="M7 18a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.5 1.5A3.8 3.8 0 0 1 17.5 18z"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/>',
  laptop: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  check: '<path d="m5 12 5 5L20 7"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24">${ICONS[n] || ICONS.tag}</svg>`;
const guessIcon = name => [[/client|^work/, 'briefcase'], [/own|personal|side|build/, 'sprout'], [/deep|focus/, 'target'], [/message|comm|chat|email/, 'chat'],
  [/meet|call/, 'video'], [/learn|study|read|course/, 'book'], [/plan|admin|calendar/, 'calendar'], [/review/, 'eye'], [/social|feed/, 'phone'],
  [/video|youtube|stream/, 'play'], [/news/, 'news'], [/shop/, 'bag'], [/down|distract|break|fun/, 'coffee'], [/other/, 'dots']].find(([re]) => re.test(name))?.[1] || 'tag';
const PROVIDER_ICONS = {openrouter: 'cloud', typesafe: 'key', local: 'laptop'};
const GUIDES = {
  openrouter: {title: 'Get an OpenRouter key', link: 'https://openrouter.ai/settings/keys', steps: [
    'Create an account at <a href="https://openrouter.ai" target="_blank">openrouter.ai</a>.',
    'Add a little credit under <b>Settings → Credits</b>. At about two cents a day, $5 lasts for months.',
    'Open <b>Settings → Keys</b>, click <b>Create key</b> and copy it. It starts with <code>sk-or-</code>.',
    'Paste it here and press <b>Test</b>.']},
  typesafe: {title: 'Get a TypeSafe key', link: 'https://console.typesafe.ai', steps: [
    'Sign up at <a href="https://console.typesafe.ai" target="_blank">console.typesafe.ai</a>.',
    'Open <b>API keys</b> and create a key.',
    'Paste it here and press <b>Test</b>.']},
  local: {title: 'Run the model on this Mac', link: 'https://github.com/jundot/omlx', steps: [
    'Install oMLX, a local model server: <code>brew install jundot/omlx/omlx</code>, or download the app from <a href="https://github.com/jundot/omlx/releases" target="_blank">its releases page</a>.',
    'In oMLX, download <code>Jundot/clef-flash-oQ3e</code> (about 5.5 GB; best with 16 GB of memory or more).',
    'Start the server. It listens on <code>127.0.0.1:8000</code>.',
    'Press <b>Test</b> here. From then on, screenshots wait in a private folder, get labelled when you step away, and are deleted.'],
    note: 'Experimental: this path hasn\'t been tested end to end yet.'},
};

let S, step = 0, tested = null, poll, agentPoll, contextTab = 'self', agentFilled = false, previewTab = 'day', previewUrls = null, installed = null;
const C = {preset: null, categories: [], about: '', dirs: [], known: {}, provider: 'openrouter', model: 'perplexity/pplx-decider-v1.2', key: '',
           screenshots: true, report_time: '19:00', batch_window: '12:30-14:00'};
const KINDS = [['focus', 'Focus'], ['neutral', 'Neutral'], ['distraction', 'Distraction']];
// about 8 working hours a day, 22 days a month, one call a minute
const monthly = m => m.price ? `≈ $${(m.tokens * 480 * 22 * m.price / 1e6).toFixed(2)}/month` : 'Free';
function showExample(i) { C.categories[i].showEx = true; draw(); document.querySelector(`[data-ex="${i}"]`).focus() }
const label = n => n.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
const slug = v => v.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
const nav = (next = 'Continue', action = 'go(1)') => `<div class="nav"><button ${step ? '' : 'disabled'} onclick="go(-1)">Back</button><button class="primary" id="next" onclick="${action}">${next}</button></div>`;

const steps = [
  { // 1. goal
    render: () => `<h1>What do you want to find out?</h1><p class="lead">Pick the closest goal. You can change everything next.</p>
      ${S.presets.map(p => `<div class="card opt ${C.preset === p.id ? 'on' : ''}" onclick="pick('${p.id}')" title="${esc(p.blurb)}">
        <span class="tile">${icon(p.icon)}</span><span><b>${esc(p.title)}</b><span class="aud">${esc(p.audience)}</span></span></div>`).join('')}
      ${S.existing ? `<div class="card opt ${C.preset === 'existing' ? 'on' : ''}" onclick="pick('existing')"><span class="tile">${icon('check')}</span><span><b>Keep my current setup</b></span></div>` : ''}` + nav(),
    ok: () => !!C.preset },
  { // 2. categories
    render: () => `<h1>Your categories</h1><p class="lead">Each minute goes into exactly one. Click any text to change it.</p>
      <div class="card catlist">${C.categories.map((c, i) => `<div class="cat">
        <span class="tile">${icon(c.icon || guessIcon(c.name))}</span>
        <div>
          <input class="ghost title" value="${esc(label(c.name))}" ${c.kind === 'none' ? 'disabled' : ''} aria-label="Category name"
            oninput="C.categories[${i}].name=slug(this.value)">
          <textarea class="ghost desc" rows="1" aria-label="What it looks like on screen" placeholder="What it looks like on screen"
            oninput="C.categories[${i}].description=this.value">${esc(c.description)}</textarea>
          ${c.example || c.showEx ? `<input class="ghost ex" data-ex="${i}" value="${esc(c.example)}" aria-label="Example" placeholder="${esc('e.g. ' + (c.hint || 'something you do'))}"
            oninput="C.categories[${i}].example=this.value">` : ''}
        </div>
        <div class="kw">${c.kind === 'none' ? '<div class="catchall">Catch-all</div>' : `<div class="pills">${KINDS.map(([k, l]) =>
          `<button class="${k} ${c.kind === k ? 'on' : ''}" onclick="C.categories[${i}].kind='${k}';draw()">${l}</button>`).join('')}</div>`}
          ${c.example || c.showEx || c.kind === 'none' ? '' : `<button class="addex" onclick="showExample(${i})">+ Example</button>`}</div>
        ${c.kind === 'none' ? '<span></span>' : `<button class="x" title="Remove" onclick="C.categories.splice(${i},1);draw()">×</button>`}
      </div>`).join('')}</div>
      <button class="add" onclick="C.categories.splice(C.categories.length-1,0,{name:'new_category',description:'',example:'',kind:'neutral',icon:'tag'});draw()">${icon('plus')} Add a category</button>
      <p class="hint" style="margin-top:14px">You need at least one <b>Focus</b> category. <b>Distraction</b> counts as drifting away.</p>` + nav(),
    ok: () => C.categories.some(c => c.kind === 'focus') && C.categories.every(c => c.name && c.description.trim()) },
  { // 3. context
    render: () => `<h1>About your work</h1><p class="lead">Helps the model tell your projects apart.</p>
      <div class="tabs"><button class="${contextTab === 'self' ? 'on' : ''}" onclick="tab('self')">${icon('user')} I'll write it</button>
        <button class="${contextTab === 'agent' ? 'on' : ''}" onclick="tab('agent')">${icon('bot')} My agent writes it</button></div>
      ${contextTab === 'agent' ? `<div class="card">
          <b>Paste this into any AI agent</b> <span class="hint">Claude Code, Codex, Cursor, Gemini CLI…</span>
          <div class="prompt"><span id="prompt">Read ${esc(S.root)}/AGENT_SETUP.md and follow it to fill in my timelens context. Save the result to ${esc(S.agent_file)}</span>
            <button onclick="copyPrompt(this)" title="Copy">${icon('copy')}</button></div>
          <p style="margin:6px 0 14px"><span class="pulse"></span>Waiting for your agent…</p>
          <details><summary class="hint" style="cursor:pointer">Agent can't write files? Paste its answer here</summary>
            <textarea id="pasted" rows="4" style="margin-top:8px" placeholder='{"about": "…", "known": {…}}'></textarea>
            <button style="margin-top:8px" onclick="applyPasted()">Use this</button> <span id="pasteout" class="hint"></span></details></div>`
      : `${agentFilled ? `<div class="banner">${icon('bot')} Filled in by your agent. Check it over.</div>` : ''}
        <label class="f">About you</label><textarea rows="3" oninput="C.about=this.value" placeholder="${esc(preset()?.about_hint || 'What you do and what you work on.')}">${esc(C.about)}</textarea>
        <label class="f">Project folders</label>
        <div class="row"><input id="dirs" style="flex:1" value="${esc(C.dirs.join(', '))}" placeholder="~/code"><button onclick="scan()">Find</button></div>
        <div id="projects">${projectsHtml()}</div>`}` + nav(),
    ok: () => true, enter: () => scan(true) },
  { // 4. model and key
    render: () => { const p = S.providers[C.provider]; return `<h1>Connect a model</h1><p class="lead">Where each minute gets labelled.</p>
      ${Object.entries(S.providers).map(([id, x]) => `<div class="card opt ${C.provider === id ? 'on' : ''}" onclick="setProvider('${id}')">
        <span class="tile">${icon(PROVIDER_ICONS[id])}</span><span><b>${esc(x.label)}</b><span class="aud">${esc(x.blurb)}</span></span></div>`).join('')}
      ${p.models.length > 1 ? `<label class="f">Model</label>${p.models.map(m => `<label class="toggle" style="margin:8px 0;align-items:center"><input type="radio" name="m" ${C.model === m.id ? 'checked' : ''} onchange="C.model='${m.id}';tested=null;draw()">
        <span>${esc(m.label)}${m.note ? ` <span class="hint">· ${m.note}</span>` : ''}</span><span class="cost">${monthly(m)}</span></label>`).join('')}` : `<p class="hint" style="margin-top:14px">${esc(p.models[0].label)} <span class="cost">${monthly(p.models[0])}</span></p>`}
      <label class="f">${C.provider === 'local' ? 'Local server' : 'API key'} <button class="q" title="How do I get this?" onclick="guide()">?</button></label>
      <div class="row">${C.provider === 'local' ? `<span class="hint" style="flex:1">oMLX on <code>127.0.0.1:8000</code></span>`
        : `<input type="password" id="key" style="flex:1" value="${esc(C.key)}" placeholder="${S.existing ? 'leave empty to keep your saved key' : 'paste your key'}" oninput="C.key=this.value;tested=null">`}
        <button onclick="test()">Test</button></div>
      <p id="testout" class="hint">${tested ? `<span class="ok">✓ Works.</span> A sample Gmail inbox came back as <b>${esc(tested.choice)}</b> in ${tested.seconds}s.` : ''}</p>` + nav() },
    ok: () => !!tested },
  { // 5. preferences, then install
    render: () => `${S.dry_run ? '<div class="banner warn">Preview mode: nothing will be installed.</div>' : ''}<h1>A few preferences</h1><p class="lead">You can change these any time.</p>
      <label class="f">Daily report at</label><input type="time" value="${C.report_time}" style="width:140px" oninput="C.report_time=this.value">
      ${C.provider === 'local' ? `<label class="f">Also label queued minutes between</label>
        <input value="${esc(C.batch_window)}" style="width:180px" placeholder="12:30-14:00" oninput="C.batch_window=this.value">
        <p class="hint">Queued minutes are labelled whenever you've been away for 10 minutes, and during this window.</p>` : ''}
      <label class="f toggle" style="font-weight:400"><input type="checkbox" ${C.screenshots ? 'checked' : ''} onchange="C.screenshots=this.checked">
        <span><b>Include a screenshot</b><br><span class="hint">Off sends only the app, window title and address. Cheaper and more private, less accurate in chat apps.</span></span></label>
      <span id="installout" class="hint"></span>` + nav('Start tracking', 'install()'),
    ok: () => true },
  { // 6. permissions
    render: () => `<h1>One permission</h1><p class="lead">macOS needs to let timelens see the front window.</p>
      <div class="card"><ol class="todo">
        <li><span><button onclick="api('/api/open-settings',{})">Open Screen &amp; System Audio Recording</button></span></li>
        <li><span>Click <b>+</b>, press <b>⌘⇧G</b>, paste this path and click <b>Open</b>:<br><code id="py">${esc(installed?.python)}</code>
          <button style="margin-top:6px" onclick="navigator.clipboard.writeText($('#py').textContent);this.textContent='Copied'">Copy path</button></span></li>
        <li><span>Turn its switch on, then <button onclick="api('/api/restart',{});this.textContent='Restarted'">restart timelens</button></span></li></ol></div>
      <div id="live" class="hint">${S.dry_run ? 'Preview mode: nothing is running, so there are no minutes to show.' : 'Waiting for the first minute…'}</div>` + nav('See my report'),
    ok: () => true, enter: () => { if (!S.dry_run) { poll = setInterval(live, 5000); live(); } } },
  { // 7. preview
    wide: true,
    render: () => `<h1>Here's what you'll get</h1><p class="lead">An invented week, drawn with your categories and projects. Your real one arrives at ${C.report_time}.</p>
      <div class="tabs"><button class="${previewTab === 'day' ? 'on' : ''}" onclick="previewTab='day';draw()">Day</button><button class="${previewTab === 'week' ? 'on' : ''}" onclick="previewTab='week';draw()">Week</button></div>
      ${previewUrls ? `<iframe class="frame" src="${previewUrls[previewTab]}"></iframe>` : '<p class="hint">Drawing your preview…</p>'}` + nav('Done', "finish()"),
    ok: () => true, enter: async () => { previewUrls = await api('/api/preview', {config: C, projects: Object.values(found).flat().filter(Boolean)}); draw(); } },
];

const preset = () => S.presets.find(p => p.id === C.preset);
function pick(id) {
  C.preset = id;
  if (id === 'existing') {
    const e = S.existing, r = e.report || {}, ex = e.examples || {};
    const kind = n => (r.focus || []).includes(n) ? 'focus' : (r.distractions || []).includes(n) ? 'distraction' : (r.intentional || []).includes(n) ? 'neutral' : 'none';
    C.categories = Object.entries(e.categories).map(([name, description]) => ({name, description, example: ex[name] || '', kind: kind(name)}));
    if (!C.categories.some(c => c.kind === 'none')) C.categories.push({name: 'other', description: 'None of the above.', example: '', kind: 'none'});
    C.categories.sort((a, b) => (a.kind === 'none') - (b.kind === 'none'));
    const prov = /openrouter/.test(e.api_url) ? 'openrouter' : /typesafe/.test(e.api_url) ? 'typesafe' : 'local';
    Object.assign(C, {about: e.about || '', dirs: e.projects?.dirs || [], known: e.projects?.known || {}, screenshots: e.screenshots !== false,
      report_time: e.report_time || '19:00', provider: prov, model: e.model, batch_window: e.batch_window || C.batch_window});
  } else C.categories = preset().category.map(c => ({...c, hint: c.example, example: ''}));  // examples are optional: shown as hints
  draw();
}
function setProvider(id) { C.provider = id; C.model = S.providers[id].models[0].id; tested = null; draw() }
function guide() {
  const g = GUIDES[C.provider];
  $('#modal').innerHTML = `<div class="modal" onclick="if(event.target===this)this.remove()"><div class="card"><h2 style="margin:0 0 4px">${g.title}</h2>
    <ol>${g.steps.map(s => `<li>${s}</li>`).join('')}</ol>${g.note ? `<p class="hint warn">${g.note}</p>` : ''}
    <div class="nav" style="margin-top:16px"><a href="${g.link}" target="_blank"><button>Open ${new URL(g.link).hostname}</button></a><button class="primary" onclick="$('#modal').innerHTML=''">Got it</button></div></div></div>`;
}
let found = {};
function projectsHtml() {
  const names = Object.values(found).filter(Boolean).flat();
  if (!names.length) return '';
  return `<div class="card" style="margin-top:12px">${names.map(n =>
    `<div class="proj"><span class="hint">${icon('folder')}</span><code>${esc(n)}</code><input class="field" placeholder="What is it? e.g. Client: Acme's site" value="${esc(C.known[n] || '')}" data-n="${esc(n)}" oninput="C.known[this.dataset.n]=this.value"></div>`).join('')}</div>`;
}
async function scan(quiet) {
  const el = $('#dirs'); if (el) C.dirs = el.value.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
  if (!C.dirs.length && quiet) C.dirs = ['~/code', '~/Developer', '~/Projects', '~/src', '~/Documents/GitHub'];
  found = await api('/api/folders', {dirs: C.dirs});
  if (quiet) { C.dirs = C.dirs.filter(d => found[d]); found = Object.fromEntries(Object.entries(found).filter(([, v]) => v)); if ($('#dirs')) $('#dirs').value = C.dirs.join(', '); }
  if ($('#projects')) $('#projects').innerHTML = projectsHtml();
}
function copyPrompt(b) { navigator.clipboard.writeText($('#prompt').textContent); b.innerHTML = icon('check') }
function useAgentContext(a) {
  Object.assign(C, {about: a.about || C.about, dirs: a.dirs || C.dirs, known: {...C.known, ...(a.known || {})}});
  agentFilled = true; tab('self'); scan();
}
function applyPasted() {
  const t = $('#pasted').value, j = t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1);
  try { useAgentContext(JSON.parse(j)) } catch { $('#pasteout').innerHTML = '<span class="err">That doesn\'t look like the JSON block. Copy everything between the braces.</span>' }
}
function tab(t) {
  contextTab = t; clearInterval(agentPoll);
  if (t === 'agent') agentPoll = setInterval(async () => { const a = await api('/api/agent-context'); if (a.about || a.known) useAgentContext(a) }, 3000);
  draw();
}
async function test() {
  if ($('#key')) C.key = $('#key').value.trim();
  $('#testout').innerHTML = 'Testing…';
  try { tested = await api('/api/test', {config: C, key: C.key || null}); draw() }
  catch (e) { $('#testout').innerHTML = `<span class="err">That didn't work: ${esc(e.message)}</span>` }
}
async function install() {
  $('#installout').textContent = 'Setting up…';
  try { installed = await api('/api/install', {config: C, key: C.key || null}); go(1) }
  catch (e) { $('#installout').innerHTML = `<span class="err">${esc(e.message)}</span>` }
}
function finish() { api('/api/done', {}); $('#view').innerHTML = `<h1>All set.</h1><p class="lead">You can close this tab. Your first report arrives at ${C.report_time}.</p>` }
async function live() {
  const s = await api('/api/status'); if (!$('#live')) return clearInterval(poll);
  const rows = s.samples.map(r => `<tr><td>${new Date(r.ts * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</td><td>${esc(r.app || '')}</td>
    <td><b>${esc(r.status === 'ok' ? r.activity : r.status)}</b>${r.confidence ? ` <span class="hint">${r.confidence.toFixed(2)}</span>` : ''}</td><td>${esc(r.project && r.project !== 'none' ? r.project : '')}</td></tr>`).join('');
  $('#live').innerHTML = (s.needs_permission ? '<p class="warn">Screenshots are still blocked. Finish the steps above, then restart timelens.</p>' : '')
    + (rows ? `<b>Last few minutes</b><table class="live">${rows}</table>` : 'Waiting for the first minute…');
}
function draw() {
  $('#dots').innerHTML = steps.map((_, i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('');
  const s = steps[step];
  $('.wrap').classList.toggle('wide', !!s.wide);
  $('#view').innerHTML = s.render();
  const fit = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px' };
  document.querySelectorAll('textarea.field, textarea.ghost').forEach(fit);
  const n = $('#next');
  document.oninput = e => { if (e.target.matches('textarea.field, textarea.ghost')) fit(e.target); if (n) n.disabled = !steps[step].ok(); };
  if (n) n.disabled = !s.ok();
}
function go(d) { if (step === 2 && contextTab === 'self') scan(); clearInterval(agentPoll); clearInterval(poll); step += d; draw(); steps[step].enter?.() }
api('/api/state').then(s => {
  S = s; if (S.existing) pick('existing');
  const h = new URLSearchParams(location.hash.slice(1));  // #preset=clients&step=1&tab=agent opens a given screen (used for docs screenshots)
  if (h.get('preset')) { pick(h.get('preset')); step = +(h.get('step') || 0); contextTab = h.get('tab') || 'self'; if (h.get('provider')) setProvider(h.get('provider')); }
  draw(); steps[step].enter?.();
});
</script></body></html>

# Starting points offered during setup. Each category has:
#   description  what it looks like on screen (sent to the model)
#   example      one real-life case (also sent to the model)
#   kind         "focus" (counts toward focus blocks), "neutral", "distraction" (counted as switches),
#                or "none" (the catch-all, always last)
#   icon         an icon name from onboarding.html
# Descriptions describe what is visible on screen, and don't overlap.

[[preset]]
id = "overview"
icon = "compass"
title = "Show me where my time goes"
audience = "For anyone curious about their day"
blurb = "Work, messages, meetings, learning and downtime."
about_hint = "I'm a product manager at a 40-person startup. Most of my work happens in Linear, Figma, Notion and Google Docs."
  [[preset.category]]
  name = "work"
  icon = "pen"
  kind = "focus"
  description = "Making or editing something for work: documents, code, designs, spreadsheets, slides, data."
  example = "Writing a spec in Google Docs"
  [[preset.category]]
  name = "messages"
  icon = "chat"
  kind = "neutral"
  description = "Reading or writing messages to specific people: email, Slack, Teams, WhatsApp, direct messages."
  example = "Replying to a thread in Slack"
  [[preset.category]]
  name = "meetings"
  icon = "video"
  kind = "neutral"
  description = "On a live video or audio call, including screen sharing."
  example = "A Zoom call with the team"
  [[preset.category]]
  name = "learning"
  icon = "book"
  kind = "neutral"
  description = "Reading, watching or asking questions to understand something, without producing anything."
  example = "Reading the React documentation"
  [[preset.category]]
  name = "admin"
  icon = "calendar"
  kind = "neutral"
  description = "Organising life and work: calendar, to-do lists, expenses, invoices, bookings, forms."
  example = "Filing an expense report"
  [[preset.category]]
  name = "downtime"
  icon = "coffee"
  kind = "distraction"
  description = "Social media feeds, news, videos, games or shopping for fun."
  example = "Scrolling Instagram"
  [[preset.category]]
  name = "other"
  icon = "dots"
  kind = "none"
  description = "None of the above, or nothing in particular is on screen."
  example = "The desktop, or System Settings"


# Starting points offered during setup. Every category is a name, a plain-English definition the model reads,
# and a kind: "focus" (counts toward focus blocks), "neutral", "distraction" (counted as switches),
# or "none" (the catch-all). Definitions describe what is visible on screen, and don't overlap.

[[preset]]
id = "overview"
title = "Show me where my time goes"
blurb = "A broad picture of a working day: making things, messages, meetings, learning, admin and downtime."
about_hint = "I'm a product manager at a 40-person startup. Most of my work happens in Linear, Figma, Notion and Google Docs."
  [[preset.category]]
  name = "work"
  kind = "focus"
  description = "Making or editing something for work: documents, code, designs, spreadsheets, slides, data."
  [[preset.category]]
  name = "messages"
  kind = "neutral"
  description = "Reading or writing messages to specific people: email, Slack, Teams, WhatsApp, direct messages."
  [[preset.category]]
  name = "meetings"
  kind = "neutral"
  description = "On a live video or audio call, including screen sharing."
  [[preset.category]]
  name = "learning"
  kind = "neutral"
  description = "Reading, watching or asking questions to understand something, without producing anything: articles, documentation, tutorials, courses."
  [[preset.category]]
  name = "admin"
  kind = "neutral"
  description = "Organising life and work: calendar, to-do lists, expenses, invoices, bookings, forms."
  [[preset.category]]
  name = "downtime"
  kind = "distraction"
  description = "Social media feeds, news, videos, games or shopping for fun."
  [[preset.category]]
  name = "other"
  kind = "none"
  description = "None of the above, or nothing in particular is on screen (desktop, settings, a loading page)."

